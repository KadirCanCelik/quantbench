[project]
name = "quantbench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "huggingface-hub>=2.4.0",
    "nvidia-ml-py>=13.615.71",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "torch>=2.15.0",
    "transformers>=5.22.1",
    "typer>=0.27.3",
]

[project.scripts]
quantbench = "quantbench.cli:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
